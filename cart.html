<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Review the items in your Toy Haven cart.">
  <title>Toy Haven | Cart</title>
  <link rel="icon" href="Sd_images/Logo.jpeg">
  <link rel="stylesheet" href="style.css">
  <script src="data.js" defer></script>
  <script src="main.js" defer></script>
  <script src="cart.js" defer></script>
</head>
<body>
  <p class="announce">Free delivery on orders over Rs. 10000</p>

  <header>
    <div class="bar">
      <a href="index.html" class="logo">Toy Haven</a>
      <div class="search">
        <input type="text" id="searchBox" placeholder="Search toys..." aria-label="Search products">
        <button type="button" id="searchBtn">Search</button>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="wishlist.html">Wishlist</a></li>
          <li><a href="support.html">Support</a></li>
          <li><a href="cart.html" class="active">Cart <span class="count" id="cartCount">0</span></a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1>Your cart</h1>
    <div id="cartItems" class="tableWrap"></div>
    <p class="summary">Total: <strong id="total">Rs. 0.00</strong></p>
    <p class="summary">
      <button type="button" id="clearCart">Clear cart</button>
      <button type="button" id="checkout">Proceed to Checkout</button>
    </p>
  </main>

  <footer>
    <div class="foot">
      <ul>
        <li><a href="products.html">Products</a></li>
        <li><a href="wishlist.html">Wishlist</a></li>
        <li><a href="support.html">Support</a></li>
      </ul>
      <div>
        <label for="newsEmail">Join our newsletter</label><br>
        <input type="email" id="newsEmail" placeholder="you@email.com">
        <button type="button" id="newsBtn">Subscribe</button>
      </div>
    </div>
    <p class="copy">&copy; 2026 Toy Haven</p>
  </footer>

  <div id="modal" class="modal hidden">
    <div class="modalBox">
      <button type="button" class="close" onclick="closeModal()">Close</button>
      <img id="mImg" src="" alt="" width="600" height="450">
      <h3 id="mName"></h3>
      <p id="mCat"></p>
      <p id="mDesc"></p>
      <p id="mPrice"></p>
      <button type="button" onclick="addToCart(modalId)">Add to Cart</button>
    </div>
  </div>

  <p id="message" class="hidden"></p>
</body>
</html>
